# Environment Configuration
launcher: "accelerate"  # Options: accelerate
config_file: config/accelerate_configs/fsdp2.yaml
num_processes: 8  # Number of processes to launch (overrides config file)
main_process_port: 29500
mixed_precision: "bf16"  # Use fp16 only on GPUs without bf16 support.

# Data Configuration
data:
  datasets:
    - name: pickscore
      dataset_dir: "dataset/pickscore"
      train:
        weight: 1
        max_dataset_size: 1000
      eval: {}
  preprocessing_batch_size: 8
  dataloader_num_workers: 16
  force_reprocess: true
  cache_dir: "~/.cache/flow_factory/datasets"
  sampler_type: "auto"

# Model Configuration
model:
  finetune_type: "lora"  # Options: full, lora
  trainable_parameters_dtype: "bf16"
  lora_rank: 64
  lora_alpha: 128
  target_components: "transformer"
  target_modules: "default"  # Default: top-level DiT q/k/v/output_proj + MLP layer1/layer2; excludes llm_adapter.
  model_name_or_path: "models/animaOfficial_preview2.safetensors"  # Anima DiT checkpoint.
  model_type: "anima"
  qwen3: "models/qwen_3_06b_base.safetensors"
  vae: "models/qwen_image_vae.safetensors"
  t5_tokenizer_path: "tokenizer/t5_old"
  sd_scripts_root: "~/sd-scripts"
  attn_mode: "torch"  # Options: torch, xformers, flash, sageattn, sdpa.
  split_attn: true
  vae_chunk_size: null
  vae_disable_cache: false
  discrete_flow_shift: 1.0
  resume_path: null
  resume_type: null  # Options: lora, full, state. Null to auto-detect based on `finetune_type`

log:
  run_name: null
  project: "Flow-Factory"
  logging_backend: "wandb"  # Options: wandb, swanlab, tensorboard, none
  save_dir: "saves/"
  save_freq: 20
  save_model_only: true

# Training Configuration
train:
  trainer_type: "nft"
  advantage_aggregation: "sum"  # Options: sum, gdpo
  nft_beta: 1.0
  off_policy: true
  ema_decay_schedule: "piecewise_linear"  # Options: constant, power, linear, piecewise_linear, cosine, warmup_cosine
  flat_steps: 0
  ramp_rate: 0.001
  ema_decay: 0.5
  ema_update_interval: 1
  ema_device: "cuda"

  num_train_timesteps: 4
  time_sampling_strategy: "discrete"  # Options: uniform, logit_normal, discrete, discrete_with_init, discrete_wo_init
  time_shift: 3.0
  timestep_range: 0.5

  kl_type: "v-based"  # Options: x-based, v-based
  kl_beta: 0
  ref_param_device: "cuda"  # Options: cpu, cuda
  adv_clip_range: 5.0
  latent_storage_dtype: "bf16"

  resolution: 512
  num_inference_steps: 10
  guidance_scale: 4.0

  per_device_batch_size: 1
  group_size: 16
  global_std: false
  unique_sample_num_per_epoch: 48
  gradient_step_per_epoch: 1

  learning_rate: 1.0e-4
  adam_weight_decay: 1.0e-4
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0

  enable_gradient_checkpointing: true
  seed: 42

# Scheduler Configuration
scheduler:
  dynamics_type: "ODE"  # Options: Flow-SDE, Dance-SDE, CPS, ODE

# Evaluation settings
eval:
  resolution: 512
  per_device_batch_size: 1
  guidance_scale: 4.0
  num_inference_steps: 10
  eval_freq: 20
  seed: 42

# Reward Model Configuration
rewards:
  - name: "pick_score"
    reward_model: "PickScore"
    weight: 1.0
    batch_size: 16
    device: "cuda"
    dtype: bfloat16
