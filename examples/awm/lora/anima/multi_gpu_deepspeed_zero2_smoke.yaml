# Two-GPU Anima AWM smoke test for DeepSpeed ZeRO-2 and remote multi-reward routing.
launcher: "accelerate"
config_file: "config/deepspeed/deepspeed_zero2.yaml"
num_processes: 2
main_process_port: 29517
mixed_precision: "bf16"

data:
  datasets:
    - name: anime_custom_artist
      dataset_dir: "dataset/anime_custom_artist_eval16"
      train:
        weight: 1
        max_dataset_size: 2
  preprocessing_batch_size: 2
  dataloader_num_workers: 2
  force_reprocess: false
  cache_dir: "~/.cache/flow_factory/datasets"
  sampler_type: "group_contiguous"

model:
  finetune_type: "lora"
  trainable_parameters_dtype: "bf16"
  lora_rank: 8
  lora_alpha: 16
  target_components: "transformer"
  target_modules: "default"
  model_name_or_path: "models/animaBase1_ex05.safetensors"
  model_type: "anima"
  qwen3: "models/qwen_3_06b_base.safetensors"
  vae: "models/qwen_image_vae.safetensors"
  t5_tokenizer_path: "tokenizer/t5_old"
  sd_scripts_root: "~/sd-scripts"
  attn_mode: "flash"
  split_attn: true
  discrete_flow_shift: 1.0

log:
  run_name: "anima_awm_two_gpu_zero2_artist_multi_reward_smoke"
  project: "Flow-Factory"
  logging_backend: "none"
  save_dir: "saves/"
  save_freq: 1
  save_model_only: true

train:
  trainer_type: "awm"
  max_epochs: 2
  advantage_aggregation: "sum"
  off_policy: false
  awm_weighting: "ghuber"
  ghuber_power: 0.25
  num_train_timesteps: 1
  time_sampling_strategy: "discrete_wo_init"
  time_shift: 3.0
  timestep_range: 0.9
  clip_range: 1.0
  adv_clip_range: 1.0
  kl_type: "v-based"
  kl_beta: 0.0
  ema_kl_beta: 0.0
  ema_decay: 0.0
  latent_storage_dtype: "bf16"
  resolution: 256
  num_inference_steps: 2
  guidance_scale: 4.0
  per_device_batch_size: 1
  group_size: 2
  global_std: true
  unique_sample_num_per_epoch: 2
  gradient_step_per_epoch: 1
  learning_rate: 2.0e-5
  adam_weight_decay: 1.0e-4
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  enable_gradient_checkpointing: true
  seed: 42

scheduler:
  dynamics_type: "ODE"

eval:
  resolution: 256
  per_device_batch_size: 1
  guidance_scale: 4.0
  num_inference_steps: 2
  eval_freq: 0
  seed: 42

rewards:
  - name: "wd_reference_similarity"
    reward_model: "flow_factory.rewards.my_reward_remote.RemotePointwiseRewardModel"
    weight: 0.5
    batch_size: 4
    device: "cuda"
    dtype: bfloat16
    server_url: "http://127.0.0.1:18082"
    remote_dispatch_mode: "main_process"
    remote_max_concurrent_requests: 1
    remote_offload_after_compute: true
    timeout: 600.0
    retry_attempts: 1
  - name: "wd_convnext_perceptual"
    reward_model: "flow_factory.rewards.my_reward_remote.RemotePointwiseRewardModel"
    weight: 1.0
    batch_size: 4
    device: "cuda"
    dtype: bfloat16
    server_url: "http://127.0.0.1:18085"
    remote_dispatch_mode: "main_process"
    remote_max_concurrent_requests: 1
    remote_offload_after_compute: true
    timeout: 600.0
    retry_attempts: 1
  - name: "wavelet_reference_similarity"
    reward_model: "flow_factory.rewards.my_reward_remote.RemotePointwiseRewardModel"
    weight: 1.0
    batch_size: 4
    device: "cuda"
    dtype: bfloat16
    server_url: "http://127.0.0.1:18084"
    remote_dispatch_mode: "main_process"
    remote_max_concurrent_requests: 1
    remote_offload_after_compute: true
    timeout: 600.0
    retry_attempts: 1
